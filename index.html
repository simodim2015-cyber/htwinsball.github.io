<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>E-Card!</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #container { width: 100%; height: 100%; max-width: 800px; max-height: 600px; }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="container"></div>
  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("container").appendChild(player);

      const rawQuery = window.location.search.substring(1);
      let message;
      try { message = decodeURIComponent(rawQuery.replace(/\+/g, " ")); }
      catch { message = rawQuery; }

      player.load({
        url: "ball.swf",
        parameters: { message: message }  // change "message" to the name your SWF reads
      });
    });
  </script>
</body>
</html>
