<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>E-Card!</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #container { width: 100%; height: 100%; max-width: 800px; max-height: 600px; }
  </style>
  <!-- Load the official Ruffle web script -->
  <script src="https://unpkg.com"></script>
</head>
<body>
  <div id="container"></div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("container").appendChild(player);

      // Grab everything after the '?' in the browser address bar
      const rawQuery = window.location.search.substring(1); 
      const decodedMessage = decodeURIComponent(rawQuery);

      // Load the Flash file and pass the message into it
      player.load({
        url: "theball.swf",
        parameters: decodedMessage
      });
    });
  </script>
</body>
</html>
