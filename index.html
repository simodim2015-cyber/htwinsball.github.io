<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>E-Card!</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #container { width: 100%; height: 100%; max-width: 800px; max-height: 600px; }
    #err { position: fixed; top: 0; left: 0; color: #f66; font: 14px monospace; padding: 8px; }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="container"></div>
  <div id="err"></div>
  <script>
    const err = document.getElementById("err");
    window.addEventListener("error", e => err.textContent += "JS error: " + e.message + "\n");

    window.addEventListener("load", () => {
      try {
        const player = window.RufflePlayer.newest().createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("container").appendChild(player);

        const msg = new URLSearchParams(window.location.search).get("message") || "";
        const swfUrl = new URL("ball.swf", window.location.href);
        swfUrl.searchParams.set("message", msg);

        player.load({
          url: swfUrl.href,
          parameters: { foo: msg }
        }).catch(e => err.textContent += "Load error: " + e + "\n");
      } catch (e) {
        err.textContent += "Setup error: " + e + "\n";
      }
    });
  </script>
</body>
</html>
